body:
  - type: markdown
    attributes:
      value: |
        ## 《个人信息迁移同意书》


  - type: markdown
    attributes:
      value: |
       **为保障您的合法权益，在您签署本同意书前，请务必仔细阅读并充分理解本同意书的条款内容，确保签署本同意书完全出于您的自主意愿。如果您不同意签署本同意书，将会影响CANN项目对您的历史贡献记录进行维护和管理。**

        本人保证在签署本同意书时已具备完全民事行为能力，或虽为限制民事行为能力人但已经监护人同意。
        
        鉴于华为技术有限公司（以下简称“华为”）孵化和运营的CANN社区将代码托管平台从Gitee（运营主体为北京奥思研工智能科技有限公司）迁移至GitCode（运营主体为重庆开源共创科技有限公司，以下简称“开源共创”），本人同意:

        1.	本人在Gitee平台上注册的账号信息，包括Gitee用户名、用户昵称、账号ID、用户头像及邮箱地址（仅限用户授权公开的）同步迁移到GitCode平台，允许Gitee账号信息与GitCode账号信息绑定，即同意本人的Gitee账号信息共享给开源共创，开源共创如何处理本人信息以其隐私声明为准。
        2.	本人在 https://gitee.com/ascend 和 https://gitee.com/cann 下的代码仓中提交的问题（issue）、拉取请求（pr）、评论、代码评审数据同步迁移到GitCode平台下华为运营的CANN项目。
        3.	本人在 https://gitee.com/ascend 和 https://gitee.com/cann 下的代码仓中提交的问题（issue）、拉取请求（pr）、评论、代码评审涉及的用户昵称、邮箱地址和操作记录等个人信息同步迁移到GitCode平台，同意华为和开源共创基于维护历史贡献记录的目的处理以上个人信息。
        4.	本人同意华为基于必要的处理目的可以将前述个人信息披露和共享给其全球关联公司。


        本同意书自签署之日起生效。